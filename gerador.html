<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Overlay | Estratégia Concursos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 80%, #0369a1 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, #1d4ed8 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 50%);
            background-size: 160% 160%;
            animation: moverDegrade 12s ease infinite alternate;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes moverDegrade {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 0% 30%; }
        }

        .main-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        .card-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 450px;
            flex-shrink: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .right-column {
            display: none; 
            flex-direction: column;
            gap: 20px;
            width: 800px;
            flex-shrink: 0;
        }

        .bottom-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: left;
        }

        .header h1 { font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .header p { color: rgba(224, 242, 254, 0.8); font-size: 14px; margin-bottom: 20px; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(240, 249, 255, 0.9); }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            background-color: rgba(2, 6, 23, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .title-box {
            display: none;
            margin-bottom: 20px;
            text-align: left;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 15px;
        }

        .title-value { font-size: 15px; font-weight: 700; color: #38bdf8; word-break: break-word; }

        .color-picker-container {
            display: none;
            margin-top: 15px;
            text-align: left;
            background: rgba(2, 6, 23, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .custom-color-row { display: flex; align-items: center; justify-content: space-between; }

        input[type="color"] {
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .drive-box {
            display: none;
            margin-top: 14px;
            text-align: left;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .drive-actions { display: flex; gap: 10px; margin-top: 10px; }

        .btn-drive-open, .btn-artes-open {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }
        .btn-drive-open { background: #2563eb; }
        .btn-artes-open { background: #0284c7; }

        .btn-drive-copy {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
        .btn-drive-open:hover { background: #1d4ed8; }
        .btn-artes-open:hover { background: #0369a1; }
        .btn-drive-copy:hover { background: rgba(255, 255, 255, 0.2); }

        .actions { display: flex; flex-direction: column; gap: 12px; }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-generate { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: white; }
        .btn-copy { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; }

        .output-box { margin-top: 18px; text-align: left; }
        .output-url {
            width: 100%;
            padding: 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            color: #34d399;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .preview-container {
            width: 100%;
            height: 450px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
        }

        iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform: scale(0.4166);
            transform-origin: 0 0;
        }

        .footer-logo img { max-width: 160px; height: auto; opacity: 0.85; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            background-color: #10b981;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
    </style>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzZCCQoeVY2cRJSIlcHZCMY0LPUaH-MFhcwWp4yLgWt5NNpNm6_aZpY11gHGN9z9hPfWA/exec";
        let linkDriveVideos = "";
        let linkDriveArtes = "";

        function gerarLink() {
            var input = document.getElementById('event-id');
            var id = input ? input.value.trim() : '';

            if (!id) {
                alert('Por favor, digite o ID do evento!');
                return;
            }

            document.getElementById('title-box').style.display = 'block';
            document.getElementById('info-box').style.display = 'block';
            document.getElementById('color-section').style.display = 'block';
            document.getElementById('prova-section').style.display = 'block'; 
            
            document.getElementById('event-title-text').innerText = "A buscar dados da planilha...";
            document.getElementById('total-questoes-text').innerText = "...";

            var btnInicial = document.getElementById('btn-gerar-inicial');
            if (btnInicial) btnInicial.style.display = 'none';
            
            document.getElementById('right-column').style.display = 'flex';

            atualizarUrlFinal();
            buscarDadosEvento(id);
        }

        function buscarDadosEvento(id) {
            fetch(API_URL + "?evento=" + encodeURIComponent(id))
                .then(res => res.json())
                .then(dados => {
                    if (dados.configuracoes) {
                        var titulo = dados.configuracoes.titulo || "";
                        document.getElementById('event-title-text').innerText = (titulo && String(titulo).trim() !== "") ? titulo : "Evento #" + id;

                        var total = dados.total_questoes || 0;
                        document.getElementById('total-questoes-text').innerText = total;

                        var linkVid = dados.configuracoes.link_videos || "";
                        if (linkVid && String(linkVid).trim() !== "") {
                            linkDriveVideos = String(linkVid).trim();
                            document.getElementById('drive-url-display').value = linkDriveVideos;
                            document.getElementById('btn-open-drive').href = linkDriveVideos;
                            document.getElementById('drive-box').style.display = 'block';
                        } else {
                            document.getElementById('drive-box').style.display = 'none';
                        }

                        var linkArt = dados.configuracoes.link_artes || "";
                        if (linkArt && String(linkArt).trim() !== "") {
                            linkDriveArtes = String(linkArt).trim();
                            document.getElementById('artes-url-display').value = linkDriveArtes;
                            document.getElementById('btn-open-artes').href = linkDriveArtes;
                            document.getElementById('artes-box').style.display = 'block';
                        } else {
                            document.getElementById('artes-box').style.display = 'none';
                        }
                    }
                })
                .catch(err => {
                    console.error("Erro ao buscar dados do evento:", err);
                    document.getElementById('event-title-text').innerText = "Evento #" + id;
                    document.getElementById('total-questoes-text').innerText = "Erro ao carregar";
                });
        }

        function atualizarUrlFinal() {
            var input = document.getElementById('event-id');
            var id = input ? input.value.trim() : '';

            var corFundo = document.getElementById('color-bg').value;
            var corTexto = document.getElementById('color-text').value;
            
            // Dados da Prova
            var tipoProva = document.getElementById('tipo-prova') ? document.getElementById('tipo-prova').value.trim() : '';
            var posicaoProva = document.getElementById('posicao-prova') ? document.getElementById('posicao-prova').value : 'top-left';
            var tamanhoProva = document.getElementById('tamanho-prova') ? document.getElementById('tamanho-prova').value : '28';
            
            var usarCorProva = document.getElementById('usar-cor-prova') ? document.getElementById('usar-cor-prova').checked : false;
            var corProvaBg = document.getElementById('cor-prova-bg') ? document.getElementById('cor-prova-bg').value : '';

            var baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';
            
            var urlFinal = baseUrl + '?evento=' + encodeURIComponent(id) + 
                           '&corFundo=' + encodeURIComponent(corFundo) + 
                           '&corTexto=' + encodeURIComponent(corTexto);

            if (tipoProva !== '') {
                urlFinal += '&tipoProva=' + encodeURIComponent(tipoProva) + 
                            '&posicao=' + encodeURIComponent(posicaoProva) + 
                            '&tamanho=' + encodeURIComponent(tamanhoProva);
                if (usarCorProva) {
                    urlFinal += '&corProvaBg=' + encodeURIComponent(corProvaBg);
                }
            }

            document.getElementById('generated-url').value = urlFinal;

            var iframe = document.getElementById('preview-iframe');
            if (iframe) {
                iframe.src = urlFinal + '&v=' + new Date().getTime();
            }
        }

        function copiarLink() {
            var urlInput = document.getElementById('generated-url');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value);
            exibirToast("Link do vMix copiado com sucesso!");
        }

        function copiarLinkDrive() {
            if (linkDriveVideos) { navigator.clipboard.writeText(linkDriveVideos); exibirToast("Link copiado!"); }
        }

        function copiarLinkArtes() {
            if (linkDriveArtes) { navigator.clipboard.writeText(linkDriveArtes); exibirToast("Link copiado!"); }
        }

        function exibirToast(mensagem) {
            var toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 2500);
        }
    </script>
</head>
<body>

    <div class="main-container">
        
        <div class="card-control">
            <div class="header">
                <h1>Gabaritos Estratégia</h1>
                <p>Gerador de overlays em tempo real</p>
            </div>

            <div class="form-group">
                <label for="event-id">ID do Agendamento:</label>
                <input type="text" id="event-id" placeholder="INSERIR O ID DO INTRA AQUI!" autocomplete="off">
            </div>

            <button class="btn-generate" id="btn-gerar-inicial" onclick="gerarLink()" style="margin-top: 5px;">Carregar & Pré-visualizar</button>

            <div class="title-box" id="title-box" style="margin-top: 15px; margin-bottom: 12px;">
                <label style="margin-bottom: 4px; color: rgba(224, 242, 254, 0.7);">Evento:</label>
                <div class="title-value" id="event-title-text">A buscar dados da planilha...</div>
            </div>

            <div class="title-box" id="info-box">
                <label style="margin-bottom: 4px; color: rgba(224, 242, 254, 0.7);">Quantidade de Questões:</label>
                <div class="title-value" id="total-questoes-text">...</div>
            </div>

            <!-- SELETOR DE CORES GERAL -->
            <div class="color-picker-container" id="color-section" style="padding: 12px 15px;">
                <label style="margin-bottom: 8px; color: rgba(224, 242, 254, 0.9); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: block;">Cores Base</label>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div class="custom-color-row" style="flex: 1; margin-bottom: 0;">
                        <label style="margin: 0; font-size: 12px;">Retângulos:</label>
                        <input type="color" id="color-bg" value="#4a2b82" onchange="atualizarUrlFinal()">
                    </div>
                    <div class="custom-color-row" style="flex: 1; margin-bottom: 0;">
                        <label style="margin: 0; font-size: 12px;">Letras:</label>
                        <input type="color" id="color-text" value="#ffffff" onchange="atualizarUrlFinal()">
                    </div>
                </div>
            </div>

            <!-- TIPO DE PROVA, POSIÇÃO, TAMANHO E COR CUSTOMIZADA -->
            <div class="title-box" id="prova-section" style="margin-top: 15px; margin-bottom: 0; padding: 15px;">
                <label style="margin-bottom: 8px; color: rgba(224, 242, 254, 0.9); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: block;">Tipo de Prova (Selo Opcional)</label>
                
                <input type="text" id="tipo-prova" placeholder="Ex: Prova Tipo 1 - Azul" oninput="atualizarUrlFinal()" style="margin-bottom: 12px; padding: 10px;">
                
                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <div style="flex: 1;">
                        <label style="margin-bottom: 6px; font-size: 11px; color: rgba(224, 242, 254, 0.9);">Posição:</label>
                        <select id="posicao-prova" onchange="atualizarUrlFinal()" style="padding: 10px; font-size: 12px;">
                            <option value="top-left">Superior Esq.</option>
                            <option value="top-center">Superior Centro</option>
                            <option value="top-right">Superior Dir.</option>
                            <option value="bottom-left">Inferior Esq.</option>
                            <option value="bottom-right">Inferior Dir.</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="margin-bottom: 6px; font-size: 11px; color: rgba(224, 242, 254, 0.9);">Tam. Fonte (px):</label>
                        <input type="number" id="tamanho-prova" value="28" min="12" max="80" oninput="atualizarUrlFinal()" style="padding: 10px; font-size: 12px;">
                    </div>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(2, 6, 23, 0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.25);">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="usar-cor-prova" onchange="atualizarUrlFinal()" style="width: auto;">
                        <label for="usar-cor-prova" style="margin: 0; font-size: 12px; cursor: pointer;">Cor de Fundo Exclusiva</label>
                    </div>
                    <input type="color" id="cor-prova-bg" value="#0284c7" onchange="document.getElementById('usar-cor-prova').checked = true; atualizarUrlFinal()">
                </div>
            </div>

            <div class="drive-box" id="drive-box">
                <label>Pasta de Vídeos / Mídias do Evento:</label>
                <input type="text" class="output-url" id="drive-url-display" readonly style="margin-top: 5px;">
                <div class="drive-actions">
                    <a href="#" id="btn-open-drive" target="_blank" class="btn-drive-open">📂 Abrir Pasta</a>
                    <button type="button" class="btn-drive-copy" onclick="copiarLinkDrive()">📋 Copiar Link</button>
                </div>
            </div>

            <div class="drive-box" id="artes-box">
                <label>Pasta de Artes do Evento:</label>
                <input type="text" class="output-url" id="artes-url-display" readonly style="margin-top: 5px;">
                <div class="drive-actions">
                    <a href="#" id="btn-open-artes" target="_blank" class="btn-artes-open">🎨 Abrir Pasta Artes</a>
                    <button type="button" class="btn-drive-copy" onclick="copiarLinkArtes()">📋 Copiar Link</button>
                </div>
            </div>
        </div>

        <div class="right-column" id="right-column">
            
            <div class="preview-container" id="preview-container">
                <iframe id="preview-iframe" src=""></iframe>
            </div>

            <div class="bottom-control">
                <div class="actions">
                    <button class="btn-generate" onclick="gerarLink()">Carregar & Pré-visualizar</button>
                    <button class="btn-copy" id="btn-copy" onclick="copiarLink()">Copiar Link do vMix</button>
                </div>

                <div class="output-box" id="output-box">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: rgba(240, 249, 255, 0.9);">URL Gerada para a entrada Web Browser do vMix:</label>
                    <input type="text" class="output-url" id="generated-url" readonly>
                </div>
            </div>

        </div>

    </div>

    <div class="footer-logo">
        <img src="https://lh3.googleusercontent.com/d/14liJU9Uk5wsCe1spKmSYV-DytETRkvGS" alt="Estratégia Concursos">
    </div>

    <div class="toast" id="toast">Link copiado com sucesso!</div>

    <script>
        document.getElementById('event-id').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') gerarLink();
        });
    </script>
</body>
</html>
