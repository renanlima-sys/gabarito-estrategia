<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Overlay | Estratégia Concursos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FUNDO DEGRADÊ ANIMADO EM TONS DE AZUL E PRETO */
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 80%, #0369a1 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, #1d4ed8 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 50%);
            background-size: 160% 160%;
            animation: moverDegrade 12s ease infinite alternate;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes moverDegrade {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 0% 30%; }
        }

        /* CONTAINER PRINCIPAL LADO A LADO (FLEXBOX) */
        .main-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        /* PAINEL DE CONTROLE (LADO ESQUERDO) */
        .card-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 450px;
            flex-shrink: 0;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .header p {
            color: rgba(224, 242, 254, 0.8);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(240, 249, 255, 0.9);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            background-color: rgba(2, 6, 23, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input[type="text"]:focus {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-generate {
            background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
        }

        .btn-generate:hover {
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.55);
            filter: brightness(1.1);
        }

        .btn-copy {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            display: none;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
        }

        .btn-copy:hover {
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.55);
            filter: brightness(1.1);
        }

        .output-box {
            margin-top: 18px;
            display: none;
            text-align: left;
        }

        .output-url {
            width: 100%;
            padding: 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            color: #34d399;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        /* ÁREA DE PREVIEW (LADO DIREITO) */
        .preview-container {
            width: 800px;
            height: 450px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
            display: none;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform: scale(0.4166); /* Escala para caber em 800x450 */
            transform-origin: 0 0;
        }

        /* RODAPÉ COM LOGO */
        .footer-logo {
            margin-top: 10px;
            text-align: center;
        }

        .footer-logo img {
            max-width: 160px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .footer-logo img:hover {
            opacity: 1;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            background-color: #10b981;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* RESPONSIVIDADE PARA TELAS MENORES */
        @media (max-width: 1300px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .card-control {
                width: 100%;
                max-width: 550px;
            }
            .preview-container {
                width: 100%;
                max-width: 800px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LADO ESQUERDO: CONTROLE -->
        <div class="card-control">
            <div class="header">
                <h1>Gabaritos Estratégia</h1>
                <p>Gerador de overlays de gabarito em tempo real</p>
            </div>

            <div class="form-group">
                <label for="event-id">ID do Agendamento:</label>
                <input type="text" id="event-id" placeholder="INSERIR O ID DO INTRA AQUI!" autocomplete="off">
            </div>

            <div class="actions">
                <button class="btn-generate" onclick="gerarLink()">Carregar & Pré-visualizar</button>
                <button class="btn-copy" id="btn-copy" onclick="copiarLink()">Copiar Link do vMix</button>
            </div>

            <div class="output-box" id="output-box">
                <label style="margin-top: 12px;">URL Gerada para a entrada Web Browser do vMix:</label>
                <input type="text" class="output-url" id="generated-url" readonly>
            </div>
        </div>

        <!-- LADO DIREITO: PREVIEW -->
        <div class="preview-container" id="preview-container">
            <iframe id="preview-iframe" src=""></iframe>
        </div>
    </div>

    <!-- LOGO DO ESTRATÉGIA NO RODAPÉ -->
    <div class="footer-logo">
        <img src="https://lh3.googleusercontent.com/d/14liJU9Uk5wsCe1spKmSYV-DytETRkvGS" alt="Estratégia Concursos">
    </div>

    <div class="toast" id="toast">Link copiado com sucesso!</div>

    <script>
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';

        function gerarLink() {
            const id = document.getElementById('event-id').value.trim();

            if (!id) {
                alert('Por favor, digite o ID do evento!');
                return;
            }

            const urlFinal = `${baseUrl}?evento=${encodeURIComponent(id)}`;

            document.getElementById('generated-url').value = urlFinal;
            document.getElementById('output-box').style.display = 'block';
            document.getElementById('btn-copy').style.display = 'block';

            const iframe = document.getElementById('preview-iframe');
            iframe.src = urlFinal;
            document.getElementById('preview-container').style.display = 'block';
        }

        function copiarLink() {
            const urlInput = document.getElementById('generated-url');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value);

            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        document.getElementById('event-id').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                gerarLink();
            }
        });
    </script>
</body>
</html>
