<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador - Gabaritos Estratégia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b192c; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        .container { 
            display: flex; 
            gap: 20px; 
            background: #1e3e62; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 1280px;
        }

        .form-section { 
            width: 340px; 
            min-width: 340px; 
            display: flex;
            flex-direction: column;
        }

        .preview-section { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
        }

        h1 { font-size: 22px; margin-bottom: 4px; color: #fff; text-align: center; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; text-align: center; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #cbd5e1; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #fff; 
            font-size: 13px; 
            outline: none;
        }

        .color-pickers { display: flex; gap: 10px; margin-bottom: 15px; }
        .color-item { flex: 1; }
        input[type="color"] { width: 100%; height: 38px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }

        .btn { 
            width: 100%; 
            padding: 11px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s; 
            margin-bottom: 8px;
        }

        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }

        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }

        /* CONTAINER COM ESCALA PROPORCIONAL PARA A TELA DE PREVIEW */
        .preview-wrapper {
            width: 800px;
            height: 450px;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        iframe { 
            width: 1920px; 
            height: 1080px; 
            border: none; 
            transform: scale(0.416666); 
            transform-origin: top left;
        }
        
        .drive-box-style {
            margin-bottom: 12px; 
            background: rgba(15, 23, 42, 0.6); 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #334155;
        }

        .drive-btn {
            flex: 1; 
            text-align: center; 
            text-decoration: none; 
            padding: 7px; 
            font-size: 12px; 
            border-radius: 6px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- FORMULÁRIO -->
        <div class="form-section">
            <h1>Gabaritos Estratégia</h1>
            <p class="subtitle">Gerador de overlays em tempo real</p>

            <div class="input-group">
                <label for="event-id">ID do Agendamento:</label>
                <input type="text" id="event-id" placeholder="Ex: 176039" oninput="carregarEvento()">
            </div>

            <div class="input-group" id="event-info" style="display: none; background: #0f172a; padding: 10px; border-radius: 8px; border-left: 4px solid #2563eb;">
                <label style="margin:0;">Evento:</label>
                <span id="event-title-text" style="font-size: 13px; font-weight: bold; color: #38bdf8;">-</span>
            </div>

            <div class="color-pickers">
                <div class="color-item">
                    <label>Cor do Retângulo:</label>
                    <input type="color" id="color-bg" value="#4a2b82" onchange="atualizarUrlFinal()">
                </div>
                <div class="color-item">
                    <label>Cor da Letra:</label>
                    <input type="color" id="color-text" value="#ffffff" onchange="atualizarUrlFinal()">
                </div>
            </div>

            <!-- PASTA DE VÍDEOS -->
            <div id="drive-box" class="drive-box-style" style="display: none;">
                <label style="font-size: 11px; font-weight: bold; color: #cbd5e1;">Pasta de Vídeos / Mídias do Evento:</label>
                <input type="text" id="drive-url-display" readonly style="width: 100%; margin-top: 4px; padding: 6px; font-size: 11px;">
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <a id="btn-open-drive" href="#" target="_blank" class="drive-btn" style="background: #2563eb;">📁 Abrir Pasta</a>
                    <button onclick="copiarLinkDrive()" class="drive-btn" style="background: #475569;">📋 Copiar Link</button>
                </div>
            </div>

            <!-- PASTA DE ARTES -->
            <div id="artes-box" class="drive-box-style" style="display: none;">
                <label style="font-size: 11px; font-weight: bold; color: #cbd5e1;">Pasta de Artes do Evento:</label>
                <input type="text" id="artes-url-display" readonly style="width: 100%; margin-top: 4px; padding: 6px; font-size: 11px;">
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <a id="btn-open-artes" href="#" target="_blank" class="drive-btn" style="background: #0284c7;">🎨 Abrir Pasta Artes</a>
                    <button onclick="copiarLinkArtes()" class="drive-btn" style="background: #475569;">📋 Copiar Link</button>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <button class="btn btn-primary" onclick="carregarPreview()">Carregar & Pré-visualizar</button>
                <button class="btn btn-success" onclick="copiarLinkVMix()">Copiar Link do vMix</button>
            </div>

            <div class="input-group" style="margin-top: 10px;">
                <label>URL Gerada para o vMix:</label>
                <input type="text" id="final-url" readonly style="font-size: 11px; color: #94a3b8;">
            </div>
        </div>

        <!-- PRÉ-VISUALIZAÇÃO -->
        <div class="preview-section">
            <div class="preview-wrapper">
                <iframe id="preview-iframe" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzZCCQoeVY2cRJSIlcHZCMY0LPUaH-MFhcwWp4yLgWt5NNpNm6_aZpY11gHGN9z9hPfWA/exec";
        const BASE_INDEX_URL = "https://renanlima-sys.github.io/gabarito-estrategia/index.html"; 

        let linkDriveVideos = "";
        let linkDriveArtes = "";

        function atualizarUrlFinal() {
            var id = document.getElementById('event-id').value.trim();
            var bg = encodeURIComponent(document.getElementById('color-bg').value);
            var text = encodeURIComponent(document.getElementById('color-text').value);

            if (id) {
                var url = BASE_INDEX_URL + "?evento=" + encodeURIComponent(id) + "&corFundo=" + bg + "&corTexto=" + text;
                document.getElementById('final-url').value = url;
            } else {
                document.getElementById('final-url').value = "";
            }
        }

        function carregarEvento() {
            var id = document.getElementById('event-id').value.trim();
            atualizarUrlFinal();

            if (id.length >= 3) {
                fetch(API_URL + "?evento=" + encodeURIComponent(id))
                    .then(res => res.json())
                    .then(dados => {
                        if (dados.configuracoes) {
                            document.getElementById('event-info').style.display = 'block';
                            var titulo = dados.configuracoes.titulo || "";
                            document.getElementById('event-title-text').innerText = (titulo && String(titulo).trim() !== "") ? titulo : "Evento #" + id;

                            var linkVid = dados.configuracoes.link_videos || "";
                            if (linkVid && String(linkVid).trim() !== "") {
                                linkDriveVideos = String(linkVid).trim();
                                document.getElementById('drive-url-display').value = linkDriveVideos;
                                document.getElementById('btn-open-drive').href = linkDriveVideos;
                                document.getElementById('drive-box').style.display = 'block';
                            } else {
                                document.getElementById('drive-box').style.display = 'none';
                            }

                            var linkArt = dados.configuracoes.link_artes || "";
                            if (linkArt && String(linkArt).trim() !== "") {
                                linkDriveArtes = String(linkArt).trim();
                                document.getElementById('artes-url-display').value = linkDriveArtes;
                                document.getElementById('btn-open-artes').href = linkDriveArtes;
                                document.getElementById('artes-box').style.display = 'block';
                            } else {
                                document.getElementById('artes-box').style.display = 'none';
                            }
                        }
                    });
            } else {
                document.getElementById('event-info').style.display = 'none';
                document.getElementById('drive-box').style.display = 'none';
                document.getElementById('artes-box').style.display = 'none';
            }
        }

        function carregarPreview() {
            atualizarUrlFinal();
            var url = document.getElementById('final-url').value;
            if (url) {
                document.getElementById('preview-iframe').src = url + "&nocache=" + new Date().getTime();
            } else {
                alert("Informe um ID de Agendamento válido.");
            }
        }

        function copiarLinkVMix() {
            atualizarUrlFinal();
            var url = document.getElementById('final-url').value;
            if (url) {
                navigator.clipboard.writeText(url);
                alert("Link para o vMix copiado com sucesso!");
            } else {
                alert("Informe um ID de Agendamento primeiro.");
            }
        }

        function copiarLinkDrive() {
            if (linkDriveVideos) {
                navigator.clipboard.writeText(linkDriveVideos);
                alert("Link da pasta de vídeos copiado!");
            }
        }

        function copiarLinkArtes() {
            if (linkDriveArtes) {
                navigator.clipboard.writeText(linkDriveArtes);
                alert("Link da pasta de artes copiado!");
            }
        }
    </script>
</body>
</html>
