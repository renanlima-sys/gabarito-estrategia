<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Overlay | Estratégia Concursos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 80%, #0369a1 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, #1d4ed8 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 50%);
            background-size: 160% 160%;
            animation: moverDegrade 12s ease infinite alternate;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes moverDegrade {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 0% 30%; }
        }

        .main-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        /* COLUNA ESQUERDA */
        .card-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 450px;
            flex-shrink: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* COLUNA DIREITA (Escondida até gerar o link) */
        .right-column {
            display: none; 
            flex-direction: column;
            gap: 20px;
            width: 800px;
            flex-shrink: 0;
        }

        /* PAINEL INFERIOR DA DIREITA (BOTÃO VMIX E LINK) */
        .bottom-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: left;
        }

        .header h1 { font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .header p { color: rgba(224, 242, 254, 0.8); font-size: 14px; margin-bottom: 20px; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(240, 249, 255, 0.9); }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            background-color: rgba(2, 6, 23, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        /* CAIXAS DE INFORMAÇÃO */
        .title-box {
            display: none;
            margin-bottom: 20px;
            text-align: left;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 15px;
        }

        .title-value {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            word-break: break-word;
        }

        .color-picker-container {
            display: none;
            margin-top: 15px;
            text-align: left;
            background: rgba(2, 6, 23, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .custom-color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .custom-color-row:last-child { margin-bottom: 0; }

        input[type="color"] {
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .drive-box {
            display: none;
            margin-top: 14px;
            text-align: left;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .drive-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-drive-open, .btn-artes-open {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }

        .btn-drive-open { background: #2563eb; }
        .btn-artes-open { background: #0284c7; }

        .btn-drive-copy {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
