<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Overlay | Estratégia Concursos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 20% 80%, #0369a1 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, #1d4ed8 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 50%);
            background-size: 160% 160%;
            animation: moverDegrade 12s ease infinite alternate;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes moverDegrade {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 0% 30%; }
        }

        .main-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        .card-control {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 450px;
            flex-shrink: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .header h1 { font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .header p { color: rgba(224, 242, 254, 0.8); font-size: 14px; margin-bottom: 20px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(240, 249, 255, 0.9); }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            background-color: rgba(2, 6, 23, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .color-picker-container {
            display: none;
            margin-top: 15px;
            text-align: left;
            background: rgba(2, 6, 23, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .color-presets {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot:hover { transform: scale(1.1); }

        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-generate { background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%); color: white; }
        .btn-copy { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; display: none; }

        .output-box { margin-top: 18px; display: none; text-align: left; }
        .output-url {
            width: 100%;
            padding: 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            color: #34d399;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .preview-container {
            width: 800px;
            height: 450px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
            display: none;
            flex-shrink: 0;
        }

        iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform: scale(0.4166);
            transform-origin: 0 0;
        }

        .footer-logo img { max-width: 160px; height: auto; opacity: 0.85; }
        .toast {
            position: fixed;
            bottom: 30px;
            background-color: #10b981;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
        }
    </style>
    <script>
        var corSelecionada = "#4a2b82";

        function gerarLink() {
            var input = document.getElementById('event-id');
            var id = input ? input.value.trim() : '';

            if (!id) {
                alert('Por favor, digite o ID do evento!');
                return;
            }

            atualizarUrlFinal();

            document.getElementById('color-section').style.display = 'block';
            document.getElementById('output-box').style.display = 'block';
            document.getElementById('btn-copy').style.display = 'block';
            document.getElementById('preview-container').style.display = 'block';
        }

        function selecionarCor(hex) {
            corSelecionada = hex;
            document.getElementById('custom-color').value = hex;
            atualizarUrlFinal();
        }

        function atualizarUrlFinal() {
            var input = document.getElementById('event-id');
            var id = input ? input.value.trim() : '';
            var baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';
            var urlFinal = baseUrl + '?evento=' + encodeURIComponent(id) + '&cor=' + encodeURIComponent(corSelecionada);

            document.getElementById('generated-url').value = urlFinal;

            var iframe = document.getElementById('preview-iframe');
            iframe.src = urlFinal + '&v=' + new Date().getTime();
        }

        function copiarLink() {
            var urlInput = document.getElementById('generated-url');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value);

            var toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 2500);
        }
    </script>
</head>
<body>

    <div class="main-container">
        <div class="card-control">
            <div class="header">
                <h1>Gabaritos Estratégia</h1>
                <p>Gerador de overlays em tempo real</p>
            </div>

            <div class="form-group">
                <label for="event-id">ID do Agendamento:</label>
                <input type="text" id="event-id" placeholder="INSERIR O ID DO INTRA AQUI!" autocomplete="off">
            </div>

            <div class="color-picker-container" id="color-section">
                <label>Cor dos Retângulos do Gabarito:</label>
                <div class="color-presets">
                    <div class="color-dot" style="background-color: #4a2b82;" onclick="selecionarCor('#4a2b82')"></div>
                    <div class="color-dot" style="background-color: #1d4ed8;" onclick="selecionarCor('#1d4ed8')"></div>
                    <div class="color-dot" style="background-color: #0284c7;" onclick="selecionarCor('#0284c7')"></div>
                    <div class="color-dot" style="background-color: #059669;" onclick="selecionarCor('#059669')"></div>
                    <div class="color-dot" style="background-color: #dc2626;" onclick="selecionarCor('#dc2626')"></div>
                    <div class="color-dot" style="background-color: #0f172a;" onclick="selecionarCor('#0f172a')"></div>
                </div>
                <div class="custom-color-row">
                    <label style="margin: 0; font-size: 12px;">Cor Personalizada:</label>
                    <input type="color" id="custom-color" value="#4a2b82" onchange="selecionarCor(this.value)">
                </div>
            </div>

            <div class="actions">
                <button class="btn-generate" id="btn-gerar" onclick="gerarLink()">Carregar & Pré-visualizar</button>
                <button class="btn-copy" id="btn-copy" onclick="copiarLink()">Copiar Link do vMix</button>
            </div>

            <div class="output-box" id="output-box">
                <label style="margin-top: 12px;">URL Gerada para a entrada Web Browser do vMix:</label>
                <input type="text" class="output-url" id="generated-url" readonly>
            </div>
        </div>

        <div class="preview-container" id="preview-container">
            <iframe id="preview-iframe" src=""></iframe>
        </div>
    </div>

    <div class="footer-logo">
        <img src="https://lh3.googleusercontent.com/d/14liJU9Uk5wsCe1spKmSYV-DytETRkvGS" alt="Estratégia Concursos">
    </div>

    <div class="toast" id="toast">Link copiado com sucesso!</div>

    <script>
        document.getElementById('event-id').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                gerarLink();
            }
        });
    </script>
</body>
</html>
